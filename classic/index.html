<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspatal — Care, in perspective</title><meta name="description" content="Hospital care and operations workspace."><link rel="stylesheet" href="styles.css"></head>
<body><a class="skip" href="#main">Skip to workspace</a>
<header class="app-header"><a class="brand" href="#overview" aria-label="Aspatal overview"><span class="mark">✚</span><span>aspatal</span></a><nav aria-label="Main navigation" id="nav"></nav><div class="account-wrap"><button class="identity" id="profile-toggle" aria-expanded="false" aria-controls="account-menu"><span class="avatar">AK</span><span>Ananya Kapoor<small>Care coordinator</small></span><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5"/></svg></button><div id="account-menu" class="account-menu" hidden><div class="account-menu-head"><strong>Ananya Kapoor</strong><small>Care coordinator</small></div><a href="#profile">Account information</a><a href="#settings">Settings</a><button data-action="theme" id="menu-theme">Dark mode <span>Off</span></button><button class="logout-control" data-action="logout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 4H4v16h6m4-13 5 5-5 5m-5-5h10"/></svg>Sign out</button></div></div></header>
<div class="context"><span><i class="dot"></i> Aster Grove Hospital <span class="muted">/ Bengaluru</span></span><span class="shift-clock">14 November 2026 · Day shift <span aria-hidden="true">·</span> <time id="current-time" aria-label="Current time in India"></time></span></div>
<section id="login-screen" hidden aria-label="Sign in"></section><main id="main" tabindex="-1"></main>
<aside id="detail" class="detail glass" aria-labelledby="detail-title" hidden></aside>
<section id="metrics" class="metric-panel glass" aria-label="Operational insights" hidden></section>
<div id="dock" class="dock glass" aria-label="Open operational insights"></div>
<div class="toast" role="status" id="toast" hidden></div>
<dialog id="contact-card" aria-label="Floor contact details"></dialog><dialog id="analytics"></dialog><dialog id="task-editor"></dialog><dialog id="admission"><form id="admit-form"><div class="panel-head"><h2>Register patient</h2><button type="button" data-action="close-admission" aria-label="Close registration">×</button></div><p class="muted">Assign an available bed.</p><label>Patient name<input name="name" required maxlength="60" autocomplete="off"></label><label>Age<input name="age" type="number" min="0" max="120" required></label><label>Available bed<select name="bed" required></select></label><button class="primary" type="submit">Register & assign bed</button></form></dialog>
